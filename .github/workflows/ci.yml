name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python pin 3.13 && uv venv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run migrations
        run: |
          mkdir -p .dev-config
          HAULARR_CONFIG_DIR=$(pwd)/.dev-config uv run alembic upgrade head

      - name: Run tests
        env:
          HAULARR_CONFIG_DIR: ${{ github.workspace }}/.dev-config
        run: uv run pytest backend/tests/ -v --tb=short

      - name: Generate OpenAPI artifact
        env:
          HAULARR_CONFIG_DIR: ${{ github.workspace }}/.dev-config
        run: |
          uv run python -c "
          from app.main import create_app
          import json
          app = create_app()
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          print(f'OpenAPI paths: {len(schema[\"paths\"])}')
          "

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t haularr .
